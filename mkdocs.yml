site_name: Platform 2026.2 - pna26
site_description: Plataforma de microsserviços (Gateway, Auth, Account, Exchange) no EKS - Insper
site_author: Leonardo, Nicolas e Gabriel
site_url: https://pna26.github.io/platform
repo_url: https://github.com/pna26/platform
repo_name: pna26/platform
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    # Light mode
    - scheme: default
      primary: grey
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: grey
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: grey
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: grey
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to system preference
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.path
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
  icon:
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - markdown_grid_tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # permite incluir o código dos submódulos (api/...) nas páginas
      base_path: [ "." ]
      check_paths: true
      url_download: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: python
          class: python
          validator: !!python/name:markdown_exec.validator
          format: !!python/name:markdown_exec.formatter
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - footnotes
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.blocks.caption
  - tables

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      # seletor de idioma em extra.alternate (o automático não funciona com navigation.instant)
      reconfigure_material: false
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt
          name: Português
          build: true
          nav_translations:
            Architecture: Arquitetura
            How to run: Como rodar
            Microservices: Microsserviços
            Load balancing: Balanceamento de carga
            Exchange rate cache: Cache da cotação (Exchange)
            Vulnerability scanning: Varredura de vulnerabilidades
            Observability: Observabilidade
            Messaging: Mensageria
            Authorization (RBAC): Autorização (RBAC)
            DevOps and cloud: DevOps e nuvem
            Load testing: Testes de carga
            PaaS, costs and SLA: PaaS, custos e SLA
            Use of AI: Uso de IA
            Presentation: Apresentação
            This documentation: Esta documentação
  - glightbox
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
  - git-authors:
      fallback_to_empty: true
  - search
  - badges
  - minify:
      minify_html: true
  - markdown-exec
  - render_swagger:
      allow_arbitrary_locations: true
  - termynal:
      prompt_literal_start:
        - "$"
        - ">"

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Architecture: arquitetura.md
  - How to run: como-rodar.md
  - Microservices:
      - Gateway: servicos/gateway.md
      - Auth: servicos/auth.md
      - Account: servicos/account.md
      - Exchange: servicos/exchange.md
  - Bottlenecks:
      - bottlenecks/index.md
      - Load balancing: bottlenecks/load-balancing.md
      - Cache (Redis): bottlenecks/cache.md
      - Exchange rate cache: bottlenecks/exchange-cache.md
      - Vulnerability scanning: bottlenecks/vulnerability-scanning.md
      - Observability: bottlenecks/observability.md
      - Messaging: bottlenecks/messaging.md
      - Authorization (RBAC): bottlenecks/rbac.md
  - DevOps and cloud:
      - CI/CD: devops/ci-cd.md
      - AWS: devops/aws.md
      - EKS: devops/eks.md
      - Load testing: devops/load-testing.md
      - PaaS, costs and SLA: devops/custos-sla.md
  - Use of AI: uso-de-ia.md
  - Presentation: apresentacao.md
  - This documentation: thisdocumentation.md

extra:
  alternate:
    - name: English
      link: /platform/
      lang: en
    - name: Português
      link: /platform/pt/
      lang: pt
