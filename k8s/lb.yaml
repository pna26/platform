# Bottleneck: balanceamento de carga no EKS.
#
#   internet -> ELB da AWS (Service type LoadBalancer)
#            -> pods do Nginx (lb, 2 réplicas)
#            -> Service gateway (ClusterIP) -> pods do gateway (2+ réplicas)
#
# O Nginx é a única porta de entrada: gateway, auth, account e exchange são
# ClusterIP (camada confiável), como no compose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lb-configmap
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr notice;

    events {
        worker_connections 1024;
    }

    http {
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path       /tmp/proxy_temp;
        fastcgi_temp_path     /tmp/fastcgi_temp;
        uwsgi_temp_path       /tmp/uwsgi_temp;
        scgi_temp_path        /tmp/scgi_temp;

        log_format upstream '$remote_addr "$request" $status -> $upstream_addr ($upstream_response_time s)';
        access_log /dev/stdout upstream;

        # no k8s o Service "gateway" já é um IP virtual que distribui entre
        # os pods; o Nginx mantém conexões abertas com ele (keepalive)
        upstream gateways {
            server gateway:8080;
            keepalive 32;
            # o Service balanceia conexões, não requisições: sem limite, cada
            # conexão fica no mesmo pod por 1000 requisições e as réplicas que o
            # HPA cria levam ~1,5 min para receber carga (~35-40 s com 10 s)
            keepalive_time 10s;
        }

        server {
            listen 8080;
            server_tokens off;

            location = /lb/health {
                access_log off;
                return 200 "ok\n";
            }

            location = /gateway/actuator/health {
                proxy_pass http://gateways;
            }
            location /gateway/actuator {
                return 404;
            }

            location / {
                proxy_pass         http://gateways;
                proxy_http_version 1.1;
                proxy_set_header   Connection        "";
                proxy_set_header   Host              $host;
                proxy_set_header   X-Real-IP         $remote_addr;
                proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                proxy_set_header   X-Forwarded-Proto $scheme;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lb
  labels:
    app: lb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lb
  template:
    metadata:
      labels:
        app: lb
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /lb/health
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: lb-configmap
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lb
spec:
  type: LoadBalancer
  selector:
    app: lb
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
